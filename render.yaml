services:
  - type: web
    runtime: static
    name: magnit-dubai
    buildCommand: echo ok
    staticPublishPath: site
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://magnit-shop-dcoe.onrender.com wss://generativelanguage.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
